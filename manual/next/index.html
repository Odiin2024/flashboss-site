<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>FlashBoss Manual (draft)</title>
<!-- DRAFT 2026-09-30, not linked, not committed. Reads ../screens.json unchanged, so every
     existing ?screen= deep link keeps working. The map in the corner is drawn from each
     screen's parents/children/childLabels: parents above, this screen, children below. -->
<style>
:root{
  --bg:#050409; --panel:#0d0b16; --rule:#2a2540; --ink:#ece4d4; --dim:#8f88a3;
  --gold:#f2c14e; --blue:#7ec8ff; --purple:#9b7bff;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:var(--blue)}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:13px}
.top .brand{color:var(--gold);font-weight:700;letter-spacing:.12em;text-decoration:none}
.top .crumbs{color:var(--dim);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top .crumbs a{color:var(--dim);text-decoration:none}.top .crumbs a:hover{color:var(--ink)}
.top .steam{color:var(--bg);background:var(--gold);padding:6px 12px;border-radius:4px;text-decoration:none;font-weight:700}

main{display:grid;grid-template-columns:minmax(0,586px) minmax(280px,1fr);gap:40px;padding:28px 22px 60px;max-width:1280px;margin:0 auto;align-items:start}
.shot{position:relative}
.shot img{display:block;width:100%;height:auto;border-radius:6px;background:#000}
.side{display:flex;flex-direction:column;gap:22px;min-width:0}

/* the map: parents / this / children, as thumbnails with connecting lines */
.map{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 12px 10px}
.map h2{font:600 11px var(--mono);letter-spacing:.14em;color:var(--dim);margin-bottom:8px}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.row{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 14px;z-index:1}
.row:last-child{margin-bottom:2px}
.node{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--dim);font:11px var(--mono);width:72px}
.node img{width:72px;height:79px;object-fit:cover;object-position:top;border:1px solid var(--rule);border-radius:4px;background:#000;transition:border-color .15s,transform .15s}
.node:hover img,.node:focus-visible img{border-color:var(--blue);transform:translateY(-2px)}
.node:hover,.node:focus-visible{color:var(--ink);outline:none}
.node .k{color:var(--bg);background:var(--blue);border-radius:3px;padding:0 5px;font-weight:700}
.node.self{width:96px;cursor:default}
.node.self img{width:96px;height:106px;border:2px solid var(--gold)}
.node .t{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

h1{font:700 26px/1.2 var(--mono);color:var(--ink)}
.sub{color:var(--gold);font:13px var(--mono);letter-spacing:.06em;margin-top:4px}
.desc{color:#cfc6b6;max-width:52ch}
.keys{list-style:none;border-top:1px solid var(--rule)}
.keys li{border-bottom:1px solid var(--rule)}
.keys a{display:flex;gap:12px;align-items:baseline;padding:8px 2px;text-decoration:none;color:var(--ink)}
.keys a:hover{background:var(--panel)}
.keys b{font:700 15px var(--mono);color:var(--gold);min-width:1.6em}
.keys span{color:var(--dim);font-size:13px}
.more{font:13px var(--mono)}
.hint{color:var(--dim);font:12px var(--mono)}
kbd{font:700 12px var(--mono);color:var(--gold);border:1px solid var(--rule);border-radius:3px;padding:0 4px}

@media (max-width:820px){
  main{grid-template-columns:1fr;gap:22px;padding:18px 16px 48px}
  .side{order:-1}
  .map{order:-1}
  .node{width:60px}.node img{width:60px;height:66px}
  .node.self{width:76px}.node.self img{width:76px;height:84px}
  h1{font-size:22px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../../home.html">FLASHBOSS</a>
  <nav class="crumbs" id="crumbs"></nav>
  <a class="steam" href="https://store.steampowered.com/app/4134440/FlashBoss/?utm_source=website-manual">Steam</a>
</header>
<main>
  <div class="shot"><img id="shot" alt=""></div>
  <div class="side">
    <section class="map" aria-label="Where this screen sits">
      <h2>MAP</h2>
      <svg id="lines" aria-hidden="true"></svg>
      <div class="row" id="parents"></div>
      <div class="row" id="self"></div>
      <div class="row" id="children"></div>
    </section>
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="subheader"></div>
    </div>
    <p class="desc" id="desc"></p>
    <ul class="keys" id="keys"></ul>
    <p class="more" id="more"></p>
    <p class="hint">Keys work here as in the game: press a number to follow it, <kbd>9</kbd> to go back.</p>
  </div>
</main>
<script>
let S={}, cur=null;
const $=id=>document.getElementById(id);
const IMG=p=>'../'+encodeURI(p);
const strip=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent.trim();};
function node(id,cls,key){
  const s=S[id]; if(!s) return null;
  const a=document.createElement(cls==='self'?'div':'a');
  a.className='node '+(cls||''); if(cls!=='self'){a.href='?screen='+id; a.onclick=e=>{e.preventDefault();go(id);};}
  a.title=s.title; a.dataset.id=id;
  a.innerHTML=`<img src="${IMG(s.image)}" alt="" loading="lazy"><span class="t">${key?`<span class="k">${key}</span> `:''}${s.title}</span>`;
  return a;
}
function draw(){
  const svg=$('lines'), box=svg.getBoundingClientRect(); svg.innerHTML='';
  const me=$('self').querySelector('img'); if(!me) return;
  const c=r=>({x:r.left+r.width/2-box.left, top:r.top-box.top, bot:r.bottom-box.top});
  const m=c(me.getBoundingClientRect());
  const line=(x1,y1,x2,y2)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    const my=(y1+y2)/2; p.setAttribute('d',`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    p.setAttribute('fill','none');p.setAttribute('stroke','#3b3458');p.setAttribute('stroke-width','1.5');svg.appendChild(p);};
  $('parents').querySelectorAll('img').forEach(i=>{const p=c(i.getBoundingClientRect());line(p.x,p.bot,m.x,m.top);});
  $('children').querySelectorAll('img').forEach(i=>{const p=c(i.getBoundingClientRect());line(m.x,m.bot,p.x,p.top);});
}
function trail(id){ // walk first parents up to the root for the breadcrumb
  const t=[]; let x=id, seen=new Set();
  while(x&&S[x]&&!seen.has(x)){seen.add(x);t.unshift(x);x=(S[x].parents||[])[0];}
  return t;
}
function go(id,push=true){
  if(!S[id]) id='entrance'; cur=id; const s=S[id];
  if(push) history.pushState({id},'','?screen='+id);
  document.title=s.title+' — FlashBoss Manual';
  $('shot').src=IMG(s.image); $('shot').alt=s.title+' screen in FlashBoss';
  $('title').textContent=s.title; $('subheader').textContent=s.subheader||'';
  $('desc').textContent=s.description||strip(s.descriptionHTML);
  for(const r of ['parents','self','children']) $(r).innerHTML='';
  // back (9) is shown as the parent row, not repeated among the children
  const kids=(s.children||[]).filter(k=>!(s.parents||[]).includes(k));
  (s.parents||[]).forEach(p=>{const n=node(p,'',(s.childLabels||{})[p]);n&&$('parents').appendChild(n);});
  $('self').appendChild(node(id,'self'));
  kids.forEach(k=>{const n=node(k,'',(s.childLabels||{})[k]);n&&$('children').appendChild(n);});
  $('keys').innerHTML=(s.children||[]).filter(k=>S[k]).map(k=>{
    const lab=(s.childLabels||{})[k]||'', name=strip((s.childDisplayNames||{})[k])||S[k].title;
    return `<li><a href="?screen=${k}" data-go="${k}"><b>${lab}</b>${name}<span>${S[k].subheader||''}</span></a></li>`;}).join('');
  $('keys').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go);});
  $('more').innerHTML=s.learnMore?`<a href="#more-${s.learnMore}">More about ${s.title.toLowerCase()} →</a>`:'';
  $('crumbs').innerHTML=trail(id).map(t=>`<a href="?screen=${t}">${S[t].title}</a>`).join(' › ');
  $('crumbs').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();go(new URL(a.href).searchParams.get('screen'));});
  requestAnimationFrame(()=>requestAnimationFrame(draw));
  window.scrollTo({top:0});
}
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||!cur) return;
  const s=S[cur], lab=s.childLabels||{};
  const hit=Object.keys(lab).find(k=>lab[k]===e.key&&S[k]);
  if(hit){go(hit);return;}
  if(e.key==='9'||e.key==='Backspace'){const p=(s.parents||[])[0]; if(p) go(p);}
});
addEventListener('popstate',e=>go((e.state&&e.state.id)||new URLSearchParams(location.search).get('screen')||'entrance',false));
addEventListener('resize',()=>requestAnimationFrame(draw));
fetch('../screens.json').then(r=>r.json()).then(d=>{S=d;
  const id=new URLSearchParams(location.search).get('screen')||'entrance';
  go(id,false); history.replaceState({id:cur},'','?screen='+cur);});
</script>
</body>
</html>
